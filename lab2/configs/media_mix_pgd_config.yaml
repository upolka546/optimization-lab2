# Reproducible configuration for Lab 3 Media Mix PGD + Armijo.
# Values of "a" and "b" are resolved from the original NumPy seed (42).

seed: 42

channels:
  - TV
  - Digital
  - OOH
  - Search
  - Social
  - Radio

budget: 100.0


oracle_config:
  channels:
    - TV
    - Digital
    - OOH
    - Search
    - Social
    - Radio

  a:
    - 180.0
    - 150.0
    - 90.0
    - 120.0
    - 100.0
    - 60.0

  b:
    - 40.0
    - 25.0
    - 30.0
    - 10.0
    - 15.0
    - 8.0

  budget: 100.0


method_config:
  alpha0: 1.0       # initial trial step
  beta: 0.5         # backtracking multiplier
  armijo_c: 0.0001  # sufficient decrease coefficient
  max_iter: 10000
  tol: 0.0000002

# The original Python build_problem() function and executable entry point
# are not representable as YAML; this file contains their configuration data.
